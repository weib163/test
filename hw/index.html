<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>We Are Happy · 课后练习</title>
<style>
@font-face{font-family:Fredoka;font-weight:500;src:url(font/fredoka-500.woff2) format('woff2');font-display:swap}
@font-face{font-family:Fredoka;font-weight:700;src:url(font/fredoka-700.woff2) format('woff2');font-display:swap}
:root{--pink:#ef5d8b;--pinkd:#c93a69;--purple:#8e6bbf;--ink:#3b2a44;--cream:#fff7e6;--yellow:#ffd23f;--green:#2fa64a;--line:#f0dfc4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Fredoka,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;font-weight:500;color:var(--ink);background:linear-gradient(#ffe9a8,#ffd97a);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--cream);box-shadow:0 0 40px rgba(120,80,20,.18)}
header{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--purple);color:#fff}
header .ttl{flex:1;min-width:0;line-height:1.15}
header .ttl b{display:block;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl small{font-size:12px;opacity:.9}
header img{height:40px}
#back{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);font-size:24px;line-height:1;visibility:hidden}
#back.on{visibility:visible}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 18px;display:none}
main.on{display:block}
h2{font-size:24px;margin:2px 0 4px;font-weight:700}
p.sub{margin:0 0 12px;font-size:14px;opacity:.8}
/* home */
.hello{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hello img{height:84px}
.hello b{font-size:24px;font-weight:700;display:block}
.lcard{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:0 5px 0 var(--line)}
.lcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.lcard .num{flex:none;width:56px;height:56px;border-radius:16px;background:var(--pink);color:#fff;font-size:30px;font-weight:700;display:grid;place-items:center}
.lcard .tx{flex:1;min-width:0}
.lcard .tx b{font-size:20px;font-weight:700;display:block}
.lcard .tx .emo{font-size:24px;letter-spacing:4px;display:block;margin:3px 0 4px}
.stars{display:flex;gap:4px}
.stars i{width:18px;height:18px;border-radius:50%;background:#eadfcc;display:block}
.stars i.on{background:var(--yellow);box-shadow:inset 0 -2px 0 #d9a400}
.bonus{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:#efe7fa;border-radius:16px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.bonus .emo{font-size:26px}
.tipbox{font-size:13px;line-height:1.5;background:#fff3cf;border-radius:14px;padding:10px 12px;margin-top:4px}
/* steps */
#steps{flex:none;display:none;gap:6px;padding:8px 10px;background:#fff;border-bottom:2px solid var(--line)}
#steps.on{display:flex}
#steps button{flex:1;border-radius:12px;padding:4px 2px;font-size:13px;line-height:1.25;background:#f6efe2;border:2px solid transparent;position:relative}
#steps button .emo{display:block;font-size:22px;margin-bottom:1px}
#steps button.cur{background:#ffe3ec;border-color:var(--pink);color:var(--pinkd)}
#steps button.ok::after{content:"";position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--green)}
#bar{flex:none;display:none;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line)}
#bar.on{display:flex}
#bar button{height:52px;border-radius:16px;font-size:18px;font-weight:700}
#prevStep{flex:none;width:92px;background:#f1e7d6}
#nextStep{flex:1;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pinkd)}
#nextStep:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pinkd)}
/* video */
.vbox{position:relative;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 5px 0 var(--line);aspect-ratio:16/10}
.vbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vbox .vplay{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--pink);box-shadow:0 5px 0 var(--pinkd);display:grid;place-items:center}
.vbox .vplay svg{width:38px;height:38px;fill:#fff;margin-left:4px}
.vbox.playing .vplay{display:none}
.vbox .vbig{position:absolute;right:8px;bottom:8px;background:rgba(40,25,50,.6);color:#fff;font-size:12px;border-radius:9px;padding:5px 9px}
.vbox.full{position:fixed;z-index:30;border-radius:0;box-shadow:none;aspect-ratio:auto;left:50%;top:50%}
.prog{height:10px;border-radius:6px;background:#eadfcc;overflow:hidden;margin:12px 4px 0}
.prog b{display:block;height:100%;width:0;background:var(--pink)}
.speed{display:flex;align-items:center;gap:8px;margin:14px 0 0}
.speed span{font-size:14px;opacity:.8;flex:none}
.speed button{flex:1;height:48px;border-radius:14px;background:#fff;border:3px solid var(--line);font-size:18px;font-weight:700}
.speed button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.speed button small{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:-2px}
.note{font-size:13px;line-height:1.5;opacity:.85;margin:12px 2px 0}
/* words */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{position:relative;background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 6px 12px;box-shadow:0 5px 0 var(--line);text-align:center}
.wcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.wcard .pic{height:92px;display:grid;place-items:center;font-size:72px}
.wcard b{display:block;font-size:26px;font-weight:700}
.wcard.heard{border-color:#ffd23f;box-shadow:0 5px 0 #e9bf2f}
.wcard.heard::after{content:"★";position:absolute;right:8px;top:4px;color:#f2b600;font-size:22px}
.wcard.say{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.07)}}
/* game */
.ask{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 14px}
.ask button{width:92px;height:92px;border-radius:50%;background:var(--purple);box-shadow:0 6px 0 #6d4d9c;display:grid;place-items:center}
.ask button:active{transform:translateY(3px);box-shadow:0 3px 0 #6d4d9c}
.ask svg{width:46px;height:46px;fill:#fff}
.rounds{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.rounds i{width:16px;height:16px;border-radius:50%;background:#e6d9c1}
.rounds i.on{background:var(--yellow);box-shadow:inset 0 -2px 0 #d9a400}
.choices{display:grid;gap:12px}
.choices.n2{grid-template-columns:1fr 1fr}
.choices.n3{grid-template-columns:1fr 1fr 1fr}
.pick{background:#fff;border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--line);height:150px;display:grid;place-items:center;font-size:84px}
.choices.n3 .pick{font-size:64px;height:128px}
.pick.yes{border-color:var(--green);background:#eafaee;animation:pop .5s ease}
.pick.no{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.cheer{text-align:center;font-size:54px;height:64px;margin-top:10px}
/* done */
.fin{text-align:center}
.fin img{height:130px;margin-top:4px}
.fin h2{font-size:28px}
.sum{text-align:left;background:#fff;border-radius:18px;border:3px solid var(--line);padding:6px 12px;margin:10px 0}
.sum div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:17px}
.sum div:last-child{border:0}
.sum i{flex:none;width:24px;height:24px;border-radius:50%;background:#eadfcc}
.sum i.on{background:var(--yellow);box-shadow:inset 0 -3px 0 #d9a400}
.sum button{margin-left:auto;font-size:14px;color:var(--pinkd);font-weight:700;padding:4px 8px}
/* story (bonus) */
.spread{position:relative;background:#fff;border-radius:16px;border:3px solid #fff;box-shadow:0 5px 0 var(--line);overflow:hidden;aspect-ratio:2/1}
.spread img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.spread .zoomhint{position:absolute;right:6px;bottom:6px;background:rgba(40,25,50,.6);color:#fff;font-size:11px;border-radius:9px;padding:3px 7px}
.dots{display:flex;justify-content:center;gap:5px;margin:9px 0 2px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:#e6d9c1}
.dots i.on{background:var(--pink);transform:scale(1.25)}
.ctl{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0 2px}
.ctl .sm{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.ctl .big{width:76px;height:76px;border-radius:50%;background:var(--pink);box-shadow:0 5px 0 var(--pinkd);display:grid;place-items:center}
.ctl svg{width:26px;height:26px;fill:var(--ink)}
.ctl .big svg{width:34px;height:34px;fill:#fff}
#zoom{position:fixed;inset:0;background:#1c1322;display:none;z-index:20}
#zoom.on{display:block}
#zoom img{position:absolute;left:50%;top:50%;background:#fff}
#zoom span,#veil span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:10px;white-space:nowrap}
#veil{position:fixed;inset:0;background:#000;display:none;z-index:25}
#veil.on{display:block}
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="返回">‹</button><div class="ttl"><b id="hTitle"></b><small id="hSub">课后练习</small></div><img src="img/lulu_happy.svg" alt=""></header>
  <nav id="steps"></nav>
  <main id="home"></main>
  <main id="s-song"></main>
  <main id="s-words"></main>
  <main id="s-game"></main>
  <main id="s-done"></main>
  <main id="s-story"></main>
  <footer id="bar"><button id="prevStep">上一步</button><button id="nextStep">下一步</button></footer>
</div>
<div id="veil"></div>
<div id="zoom"><img alt=""><span>点一下回去</span></div>
<script>
'use strict';
const D = {"u": 1, "title": "We Are Happy", "storyName": "We Are Happy", "g": "audio/g_", "video": "video/song.mp4", "poster": "img/poster.jpg", "words": [{"t": "happy", "e": "😀", "a": "audio/w_0.mp3"}, {"t": "clap", "e": "👏", "a": "audio/w_1.mp3"}, {"t": "stomp", "e": "🦶", "a": "audio/w_2.mp3"}, {"t": "turn around", "e": "🔄", "a": "audio/w_3.mp3"}, {"t": "sad", "e": "😢", "a": "audio/w_4.mp3"}, {"t": "angry", "e": "😠", "a": "audio/w_5.mp3"}, {"t": "sleepy", "e": "😴", "a": "audio/w_6.mp3"}, {"t": "hello", "e": "👋", "a": "audio/w_7.mp3"}], "lessons": [{"w": [0, 1, 2, 3]}, {"w": [4, 5, 6, 7]}, {"w": [0, 2, 5, 7]}], "story": {"audio": "audio/story.mp3", "pages": [["img/book0.webp", [6.5, 16.4]], ["img/book2.webp", [19.8, 28.4]], ["img/book3.webp", [29.8, 36.9]], ["img/book4.webp", [42.8, 53.0]], ["img/book5.webp", [54.3, 63.0]], ["img/book6.webp", [68.7, 79.7]], ["img/book7.webp", [81.3, 91.2]], ["img/book8.webp", [91.7, 104.4]], ["img/book9.webp", [105.1, 118.5]]]}};
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const Q = new URLSearchParams(location.search);
const NAME = (Q.get('name') || '').trim().slice(0, 20);
const SK = 'rr-hw-v2:u' + D.u + ':' + (Q.get('key') || 'preview');
const IC = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>', pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M16 4L6 12l10 8z"/></svg>', next: '<svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg>',
  ear: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM15.5 8.5a5 5 0 010 7l1.4 1.4a7 7 0 000-9.8z"/></svg>'
};
const STEPS = [['song', '唱一唱', '🎵'], ['words', '听一听', '👂'], ['game', '找一找', '👆']];
const SPEEDS = [[0.5, '慢'], [0.75, '稍慢'], [1, '正常']];
const blank = () => ({ song: 0, heard: [0, 0, 0, 0], game: 0 });
let S = { lesson: -1, story: 0, L: [blank(), blank(), blank()] };
try { const o = JSON.parse(localStorage.getItem(SK) || 'null'); if (o && o.L && o.L.length === 3) S = o; } catch (e) {}
const save = () => { try { localStorage.setItem(SK, JSON.stringify(S)); } catch (e) {} };
const T0 = Date.now();
let view = 'home', sentDone = false, rate = 1;
const cur = () => S.L[S.lesson];
const words = l => D.lessons[l].w.map(i => D.words[i]);
const stepOK = (l, k) => k === 'song' ? l.song === 2 : k === 'words' ? l.heard.every(x => x) : l.game === 1;
const count = l => STEPS.filter(s => stepOK(l, s[0])).length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pic = w => `<span class="emo" style="font-size:${w.s || 1}em">${w.e}</span>`;

/* ---- sound ---- */
const voice = new Audio(), media = new Audio(); let vid = null, timers = [];
function say(src, onend) { voice.pause(); voice.onended = onend || null; voice.src = src; voice.play().catch(() => {}); }
const prompt = (k, onend) => say(D.g + k + '.mp3', onend);
const later = (f, ms) => timers.push(setTimeout(f, ms));
function quiet() { timers.forEach(clearTimeout); timers = []; voice.pause(); voice.onended = null; media.pause(); if (vid) vid.pause(); }
const speedBar = id => `<div class="speed" id="${id}"><span>速度</span>${SPEEDS.map(s => `<button data-r="${s[0]}" class="${s[0] === rate ? 'on' : ''}">${s[0]}×<small>${s[1]}</small></button>`).join('')}</div>`;
function wireSpeed(id, el) { $$('#' + id + ' button').forEach(b => b.onclick = () => { rate = +b.dataset.r; el.playbackRate = rate; $$('.speed button').forEach(x => x.classList.toggle('on', +x.dataset.r === rate)); }); }

/* ---- step 1: song video ---- */
function buildSong() {
  $('#s-song').innerHTML = `<h2>Sing along</h2><p class="sub">点粉色按钮看视频，跟着唱、跟着做动作。太快了就选“慢”。</p>
    <div class="vbox" id="vbox"><video playsinline webkit-playsinline preload="metadata" src="${D.video}" poster="${D.poster}"></video><button class="vplay" aria-label="播放">${IC.play}</button><button class="vbig">放大</button></div>
    <div class="prog"><b></b></div>${speedBar('spSong')}<p class="note">给家长：零基础的孩子先用 0.5× 或 0.75× 看一两遍，会哼了再用 1×。听不懂没关系，跟着动起来就好。</p>`;
  vid = $('#s-song video'); const box = $('#vbox'), bar = $('#s-song .prog b');
  const toggle = () => { voice.pause(); if (vid.paused) { vid.playbackRate = rate; vid.play().catch(() => {}); } else vid.pause(); };
  $('.vplay', box).onclick = e => { e.stopPropagation(); toggle(); };
  vid.onclick = toggle;
  vid.onplay = () => box.classList.add('playing'); vid.onpause = () => box.classList.remove('playing');
  vid.ontimeupdate = () => { if (!vid.duration) return; bar.style.width = (vid.currentTime / vid.duration * 100) + '%'; if (vid.currentTime > 5) mark('song', 1); if (vid.currentTime > vid.duration * .9) mark('song', 2); };
  vid.onended = () => { mark('song', 2); unfull(); };
  vid.onratechange = () => { if (vid.playbackRate !== rate) vid.playbackRate = rate; };
  $('.vbig', box).onclick = e => { e.stopPropagation(); box.classList.contains('full') ? unfull() : full(); };
  $('#veil').onclick = unfull; wireSpeed('spSong', vid);
}
/* "full screen" without the fullscreen API: the video lies on its side and fills the phone */
function full() { const box = $('#vbox'), W = innerWidth, H = innerHeight, rot = H > W; box.classList.add('full'); $('#veil').classList.add('on');
  box.style.width = (rot ? H : W) + 'px'; box.style.height = (rot ? W : H) + 'px'; box.style.transform = 'translate(-50%,-50%)' + (rot ? ' rotate(90deg)' : ''); $('.vbig', box).textContent = '缩小'; }
function unfull() { const box = $('#vbox'); if (!box) return; box.classList.remove('full'); $('#veil').classList.remove('on'); box.style.width = box.style.height = box.style.transform = ''; $('.vbig', box).textContent = '放大'; }

/* ---- step 2: picture words ---- */
function paintWords() {
  const l = cur(), ws = words(S.lesson);
  $('#s-words').innerHTML = `<h2>Listen and say</h2><p class="sub">点图片听一听，跟着说一遍。四张都点到就有星星。</p><div class="grid">` +
    ws.map((w, i) => `<button class="wcard${l.heard[i] ? ' heard' : ''}" data-i="${i}"><span class="pic">${pic(w)}</span><b>${esc(w.t)}</b></button>`).join('') + `</div>`;
  $$('#s-words .wcard').forEach(b => b.onclick = () => { const i = +b.dataset.i; quiet(); b.classList.remove('say'); void b.offsetWidth; b.classList.add('say', 'heard'); say(ws[i].a, () => later(() => say(ws[i].a), 500));
    if (!l.heard[i]) { l.heard[i] = 1; save(); paintSteps(); after(); } });
}

/* ---- step 3: listen and find ---- */
let G = null;
function startGame() { const ws = words(S.lesson), order = [0, 1, 2, 3].sort(() => Math.random() - .5); G = { order, r: 0, n: S.lesson === 2 ? 3 : 2, lock: false, ws }; round(true); }
function round(first) {
  const g = G, t = g.ws[g.order[g.r]];
  const same = (x, y) => x.e === y.e && (x.s || 1) === (y.s || 1);
  const pool = D.words.filter(w => !same(w, t)).sort(() => Math.random() - .5).sort((x, y) => (y.e === t.e) - (x.e === t.e));
  const others = []; pool.forEach(w => { if (others.length < g.n - 1 && !others.some(o => same(o, w))) others.push(w); });
  const opts = [t, ...others].sort(() => Math.random() - .5); g.lock = false;
  $('#s-game').innerHTML = `<h2>Listen and find</h2><p class="sub">听一听，点对的图片。点喇叭可以再听一遍。</p><div class="rounds">${g.order.map((_, i) => `<i class="${i < g.r ? 'on' : ''}"></i>`).join('')}</div>
    <div class="ask"><button aria-label="再听一遍">${IC.ear}</button></div><div class="choices n${g.n}">${opts.map((w, i) => `<button class="pick" data-ok="${w === t ? 1 : 0}">${pic(w)}</button>`).join('')}</div><div class="cheer emo"></div>`;
  const hear = () => say(t.a);
  $('#s-game .ask button').onclick = hear;
  $$('#s-game .pick').forEach(b => b.onclick = () => { if (g.lock) return;
    if (b.dataset.ok === '1') { g.lock = true; b.classList.add('yes'); $('#s-game .cheer').textContent = '🌟'; prompt('x3', () => later(() => { g.r++; if (g.r >= g.order.length) { cur().game = 1; save(); paintSteps(); after(); go('done'); } else round(); }, 350)); }
    else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); later(hear, 350); } });
  if (first) prompt('x2', () => later(hear, 300)); else later(hear, 250);
}

/* ---- bonus: story with pictures ---- */
let pi = 0;
function buildStory() {
  const P = D.story.pages;
  $('#s-story').innerHTML = `<h2>${esc(D.storyName)}</h2><p class="sub">选做：睡前听一听故事，图片会自己翻页。</p><div class="spread"><img alt=""><span class="zoomhint">点图片放大</span></div><div class="dots">${P.map(() => '<i></i>').join('')}</div>
    <div class="ctl"><button class="sm b-prev" aria-label="上一页">${IC.prev}</button><button class="big b-play" aria-label="播放">${IC.play}</button><button class="sm b-next" aria-label="下一页">${IC.next}</button></div><div class="prog"><b></b></div>${speedBar('spStory')}`;
  const img = $('#s-story .spread img'), bp = $('#s-story .b-play'), bar = $('#s-story .prog b');
  const show = i => { pi = Math.max(0, Math.min(P.length - 1, i)); img.src = P[pi][0]; $$('#s-story .dots i').forEach((d, n) => d.classList.toggle('on', n === pi)); };
  media.src = D.story.audio; show(0);
  bp.onclick = () => { voice.pause(); if (media.paused) { media.playbackRate = rate; media.play().catch(() => {}); } else media.pause(); };
  media.onplay = () => bp.innerHTML = IC.pause; media.onpause = () => bp.innerHTML = IC.play;
  media.ontimeupdate = () => { if (!media.duration) return; bar.style.width = (media.currentTime / media.duration * 100) + '%'; if (media.currentTime > 5 && S.story < 1) { S.story = 1; save(); }
    let k = pi; P.forEach((p, n) => { if (p[1] && media.currentTime >= p[1][0] - .15) k = n; }); if (k !== pi) show(k); };
  media.onended = () => { S.story = 2; save(); };
  const turn = d => { show(pi + d); if (P[pi][1]) { try { media.currentTime = P[pi][1][0]; } catch (e) {} } };
  $('#s-story .b-prev').onclick = () => turn(-1); $('#s-story .b-next').onclick = () => turn(1);
  $('#s-story .spread').onclick = () => zoom(img.src); wireSpeed('spStory', media);
}
function zoom(src) {
  const z = $('#zoom'), im = $('img', z); im.src = src;
  const fit = () => { const W = innerWidth, H = innerHeight, r = (im.naturalWidth || 2) / (im.naturalHeight || 1), rot = H > W && r > 1.1;
    const bw = rot ? H : W, bh = rot ? W : H, w = Math.min(bw, bh * r); im.style.width = w + 'px'; im.style.height = (w / r) + 'px'; im.style.transform = 'translate(-50%,-50%)' + (rot ? ' rotate(90deg)' : ''); };
  im.onload = fit; fit(); z.classList.add('on');
}
$('#zoom').onclick = () => $('#zoom').classList.remove('on');

/* ---- views ---- */
function go(v) {
  quiet(); unfull(); view = v; $$('main').forEach(m => m.classList.toggle('on', m.id === (v === 'home' ? 'home' : 's-' + v)));
  const inL = v !== 'home' && v !== 'story'; $('#steps').classList.toggle('on', inL); $('#bar').classList.toggle('on', inL); $('#back').classList.toggle('on', v !== 'home');
  $('#hSub').textContent = inL ? 'Lesson ' + (S.lesson + 1) + ' · 课后练习' : v === 'story' ? '听故事（选做）' : '课后练习';
  if (v === 'home') paintHome(); else if (inL) { paintSteps(); $('#nextStep').textContent = v === 'done' ? '回到首页' : v === 'game' ? '做完啦' : '下一步'; $('#prevStep').style.visibility = v === 'song' ? 'hidden' : 'visible'; }
  $('main.on').scrollTop = 0;
  if (v === 'song') prompt('x0');
  if (v === 'words') { paintWords(); prompt('x1'); }
  if (v === 'game') startGame();
  if (v === 'done') { paintDone(); if (count(cur()) === 3) prompt(9); }
  if (v === 'story') buildStory();
}
function paintHome() {
  $('#home').innerHTML = `<div class="hello"><img src="img/lulu_hooray.svg" alt=""><div><b>${NAME ? 'Hi, ' + esc(NAME) + '!' : 'Hi!'}</b>今天上的是哪一节课？点一下开始。</div></div>` +
    D.lessons.map((L, i) => `<button class="lcard" data-l="${i}"><span class="num">${i + 1}</span><span class="tx"><b>Lesson ${i + 1}</b><span class="emo">${words(i).map(w => w.e).join(' ')}</span><span class="stars">${STEPS.map(s => `<i class="${stepOK(S.L[i], s[0]) ? 'on' : ''}"></i>`).join('')}</span></span></button>`).join('') +
    `<button class="bonus" id="toStory"><span class="emo">📖</span><span><b>听故事（选做）</b><br>${esc(D.storyName)}</span></button>` +
    `<div class="tipbox">给家长：这是给零基础小朋友的练习，每次五分钟左右，一共三步：看视频唱儿歌、点图片听单词、听一听点图片。不用认字，也不用会说整句。做完后点练习框外面的「完成，交给老师」按钮（手机上在练习框下面）。</div>`;
  $$('#home .lcard').forEach(b => b.onclick = () => { S.lesson = +b.dataset.l; save(); const first = STEPS.find(s => !stepOK(cur(), s[0])); go(first ? first[0] : 'done'); });
  $('#toStory').onclick = () => go('story');
}
function paintSteps() { $('#steps').innerHTML = STEPS.map(s => `<button data-s="${s[0]}" class="${view === s[0] ? 'cur' : ''}${stepOK(cur(), s[0]) ? ' ok' : ''}"><span class="emo">${s[2]}</span>${s[1]}</button>`).join(''); $$('#steps button').forEach(b => b.onclick = () => go(b.dataset.s)); }
function paintDone() {
  const l = cur(), all = count(l) === 3;
  $('#s-done').innerHTML = `<div class="fin"><img src="img/lulu_hooray.svg" alt=""><h2>${all ? 'Well done!' : 'Good try!'}</h2><p class="sub">${all ? '今天的三个练习都做完了。' : '还有没做完的练习，可以现在补上，也可以先交。'}</p>
    <div class="sum">${STEPS.map(s => `<div><i class="${stepOK(l, s[0]) ? 'on' : ''}"></i>${s[1]}${stepOK(l, s[0]) ? '' : `<button data-s="${s[0]}">去完成</button>`}</div>`).join('')}</div>
    <div class="tipbox">和爸爸妈妈再唱一遍 ${esc(D.title)}，边唱边做动作。<br>交作业：点练习框外面的「完成，交给老师」按钮（手机上往下滑就能看到）。</div></div>`;
  $$('#s-done .sum button').forEach(b => b.onclick = () => go(b.dataset.s));
}
function mark(k, v) { const l = cur(); if (l && l[k] < v) { l[k] = v; save(); paintSteps(); after(); } }
$('#hTitle').textContent = D.title;
$('#back').onclick = () => go('home');
const ORDER = ['song', 'words', 'game', 'done'];
$('#nextStep').onclick = () => { const i = ORDER.indexOf(view); go(i === 3 ? 'home' : ORDER[i + 1]); };
$('#prevStep').onclick = () => { const i = ORDER.indexOf(view); if (i > 0) go(ORDER[i - 1]); };
buildSong();

/* ---- Wonder English: hand the work back to the teacher ---- */
function describe(i) {
  const l = S.L[i], st = ['还没看', '看了一部分', '看完了'], heard = words(i).filter((w, n) => l.heard[n]).map(w => w.t);
  return [`Lesson ${i + 1}`, `看视频唱儿歌 ${D.title}：${st[l.song]}`, heard.length ? `听单词，点着听了：${heard.join('、')}` : '听单词：还没听', `找一找（听单词点图片）：${l.game ? '玩完了' : '还没玩完'}`].join('\n');
}
function collect() {
  if (S.lesson < 0) return { text: `彩虹兔童谣课后练习 · ${D.title}\n还没有开始练习。`, missing: ['还没有选今天上的是哪一节课'] };
  const used = [0, 1, 2].filter(i => i === S.lesson || S.L[i].song || S.L[i].game || S.L[i].heard.some(x => x)), l = cur(), missing = [];
  if (l.song < 2) missing.push('儿歌视频还没看完'); if (!l.heard.every(x => x)) missing.push('还有单词没点着听'); if (!l.game) missing.push('找一找还没玩完');
  const story = S.story ? `\n\n选做 · 听故事《${D.storyName}》：${S.story === 2 ? '听完了' : '听了一部分'}` : '';
  return { text: (`彩虹兔童谣课后练习 · ${D.title}\n` + used.map(describe).join('\n\n') + story).slice(0, 19000), missing };
}
function after() {
  if (S.lesson >= 0 && count(cur()) === 3 && !sentDone) { sentDone = true; try { parent.postMessage({ type: 'we:complete', summary: `Lesson ${S.lesson + 1} 的三个练习都做完了` }, location.origin); } catch (e) {} }
  try { if (parent !== window) parent.postMessage({ type: 'we:progress', page: S.lesson < 0 ? 0 : count(cur()), total: 3, seconds: Math.round((Date.now() - T0) / 1000), words: [] }, location.origin); } catch (e) {}
}
window.weActivity = { collect, show() { if (S.lesson < 0) return go('home'); const first = STEPS.find(s => !stepOK(cur(), s[0])); go(first ? first[0] : 'done'); } };
addEventListener('pagehide', quiet);
document.addEventListener('visibilitychange', () => { if (document.hidden) quiet(); });
go('home');
</script>
</body>
